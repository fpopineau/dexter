# Risk rules — LIVE ACCOUNT OVERRIDES (target account €10,000 ≈ $11.7K)
#
# Loaded ON TOP of risk-rules.yaml when the IBKR connection verifies a
# non-paper account — or on the PAPER account under DEXTER_RISK_PROFILE=live
# (shadow-live: the validation runs the exact live policy; the paper account
# gets reset to ~$11,700 so absolute numbers are real too).
#
# Rationale: the base percentages are tuned for a large paper account and
# produce unusable absolute numbers on a small account. These values trade
# fewer, larger positions with a real but bounded per-trade risk.
#
# Ratified 2026-09-05 (operator, live-loop discovery R10-Q3; REQ-RISK-011)
# as the CEILING policy. Per-trade intraday risk is OVERLAID by the size
# ladder rung (ladder-state.json, bottom rung 0.25%, REQ-RISK-009):
# effective = min(max_risk_per_trade_pct below, current rung). The ladder
# climbs 0.25 → 0.5 → 0.75 → 1.0 on pre-registered evidence (WP3); the
# numbers here never move with it. Re-derived for €10K on 2026-08-22
# (the previous revision was reviewed for €3.7K); the REVIEW notes below
# are the derivation record, kept as history.

# --- Position Sizing ---
# REVIEW: was 20% × 3 slots (€3.7K era — concentration beat dust at ~€740/
# position). At €10K a position slot is real money: 15% ≈ $1,755 each, and a
# fourth slot adds diversification without dust (4 × 15% = 60% max deployed
# vs the old 3 × 20% = 60% — same book ceiling, thinner single-name risk).
# Prefer the old concentration? Set 20 / 3 back.
max_position_pct: 15 # ≈$1,755 per position on $11.7K
max_open_positions: 4

# --- Sector concentration ---
# Operator decision 2026-09-04: raised from the base 20% to 35%. At 15% x
# 4 slots the 20% cap bound after ~1.3 positions in one sector, which on a
# tech-led tape refused most second entries; 35% allows ~2.3. The bet is
# deliberate: correlated names make "four trades" closer to one, so the
# remaining guards carry more weight — the acceptance-time daily-loss
# HEADROOM gate (4 x 0.5% = 2.0% vs the 1.5% stop) still binds first
# intraday, and the 20%-gap overnight stress still caps the book that can
# ride a night. Revisit if the frozen sample shows correlated stop-outs
# clustering.
max_sector_exposure_pct: 35

# --- Daily Limits ---
# REVIEW: was 4 (commissions were a real tax on €3.7K). The take-at-x%
# policy cycles winners faster; at ~$2 round-trip against $60-200 takes,
# commissions are 1-3% of a typical win — 6 trades/day is affordable.
max_daily_trades: 6
# Kill-switch — FIRST-TRANCHE numbers (review 2026-08-23, "profit as
# surely as possible"): halved from the 3% draft. 4 slots × 0.5% budgets =
# 2.0% worst case > 1.5%, so the acceptance-time daily-loss HEADROOM gate
# binds before the position caps do — deliberately conservative. ≈$175 on
# $11.7K; three 0.5% stop-outs latch the day. Raise only as a deliberate
# risk-appetite change AFTER the first live tranche proves slippage.
# Ratified 2026-09-05.
max_daily_loss_pct: 1.5

# --- Overnight ---
max_overnight_position_pct: 15 # ≈$1,755 riding a gap — one 20% adverse gap ≈ the whole daily halt
# Gap-stress vet (2026-08-23, REVIEW): at 20% assumed gap vs the 1.5%
# daily loss, the surviving overnight book is at most 7.5% of NetLiq
# (≈$875) — roughly half of one position. Intraday is flat-by-close
# anyway (operator policy); this bounds the swing/bet book. Raise
# max_daily_loss_pct or lower the stress only as a deliberate
# risk-appetite change.
overnight_gap_stress_pct: 20

# --- Per-Trade Risk Budget ---
# FIRST-TRANCHE (review 2026-08-23): halved from the 1.0% draft — an
# unproven agent earns size with a record, not a plan. ≈$58/stop-out.
# CEILING (2026-09-05): the effective intraday budget is min(this, ladder
# rung) — the paper rehearsal and the first live epoch start at 0.25%
# (≈$29 on $11.7K) and climb on evidence; this line is the most the
# ladder may ever grant without a new ratification.
max_risk_per_trade_pct: 0.5

# --- Confidence-weighted sizing (position-sizer) ---
sizing_full_score: 80 # score >= 80 -> full risk budget
sizing_half_score: 60 # 60-79 -> sizing_half_mult x budget
sizing_half_mult: 1.0 # FLAT until the frozen sample proves decile monotonicity (VALIDATION-PROTOCOL.md)
sizing_low_mult: 1.0 # FLAT until calibrated — see above

# --- Small-account floor ---
min_risk_budget_usd: 15 # refuse trades whose weighted budget is below this — inert at $117 budgets, kept as the floor

# --- Trade Classes ---
# CLASS ENABLEMENT IS THE VALIDATION SCOPE (review 2026-08-23): the
# scorecard's go-live verdict covers exactly the classes enabled here, and
# every enabled class must clear its OWN pre-registered floor (≥30 trades,
# net-positive, PF ≥ 1.3, positive cohort LCB) or the verdict FAILS.
# FAIL-CLOSED: every class beyond intraday ships DISABLED — a scorecard is
# a report, not a runtime authorization token. Flip a class true only when
# its own shadow record PASSES and the pass is recorded in the validation
# journal. The SHADOW run force-enables these on paper so the records can
# accrue (documented deviations).
swing_enabled: false # fail-closed until the class's own ≥30-trade shadow record passes
# Swings scale with the live intraday budget (0.5%): 0.75% keeps a 3-swing
# book's total stop-out cost under ~2.25% of the account. FIRST-TRANCHE
# (halved from the 1.5% draft) — REVIEW.
swing_risk_pct: 0.75 # ≈$88 max loss per swing stop-out on $11.7K
max_swing_positions: 3
# Four-lane contract (WP5): the overnight lane's budget follows the swing
# budget at this scale (RESEARCH parameter). Note the gap-stress cap binds
# first: 1.5% / 20% = 7.5% of NetLiq (≈$877) for the WHOLE overnight book.
overnight_risk_pct: 0.75
# Earnings bets are LIVE-DISABLED until the class's own ≥30-trade shadow
# record passes (same bar as every class). The SHADOW-LIVE run forces this
# true as a documented deviation (DEXTER_RISK_PROFILE=live on paper) so
# the record can accrue at live-scale sizing; a real live account keeps
# false until the per-class review is recorded in the validation journal.
earnings_bet_enabled: false
max_earnings_bets: 1
earnings_bet_risk_pct: 0.5 # worst-case gap loss ≈$58, once enabled — FIRST-TRANCHE, halved from the 1.0% draft
earnings_bet_gap_floor_pct: 20

# --- Fractional shares ---
# KEEP FALSE: IBKR hard-blocks fractional EQUITY orders via the TWS API
# (error 10243 "use the desktop version", verified live on paper
# 2026-08-05 — a server-side policy, not a permission or setting). The
# sizer therefore trades whole shares: symbols above the per-position cap
# per share (≈$1,755 at 15% of $11.7K) are refused as unaffordable — at
# €10K that excludes almost nothing (vs the €740 cap that shut out every
# mega-priced name at €3.7K).
fractional_shares: false
