# Risk rules — LIVE ACCOUNT OVERRIDES (small account, ~€3-5K)
#
# Loaded ON TOP of risk-rules.yaml when the IBKR connection verifies a
# non-paper account. Keys absent here inherit the base file.
#
# Rationale: the base percentages are tuned for the $1M paper account and
# produce unusable absolute numbers on a small account (5% position = ~€185,
# 0.25% risk = ~€9 — inside commission noise). These values trade fewer,
# larger positions with a real but bounded per-trade risk.
#
# >>> REVIEW THESE BEFORE GOING LIVE — they are risk-appetite decisions. <<<

# --- Position Sizing ---
max_position_pct: 20 # ~€740 per position on €3.7K — one liquid mega-cap share or a few mid-caps
max_open_positions: 3 # concentration beats dust at this size

# --- Daily Limits ---
max_daily_trades: 4 # commissions are a real tax at this size
# Kill-switch, sized to the book the caps above authorize (audit
# 2026-08-11: the base 2% was breachable by planned stops alone — 3 slots
# x 1.0-1.5% budgets = 3.0-4.5% worst case, so two ordinary stop-outs
# latched the halt). At 3.0%: a full 3-intraday book (3 x 1.0%) fits
# exactly; swing-heavy mixes (up to 4.5%) hit the acceptance-time
# daily-loss HEADROOM gate before the position caps do — deliberately
# conservative. Raise to 4.5 only if the caps should always bind first.
# ~E111 on E3.7K. >>> REVIEW before go-live. <<<
max_daily_loss_pct: 3

# --- Overnight ---
max_overnight_position_pct: 15

# --- Per-Trade Risk Budget ---
max_risk_per_trade_pct: 1.0 # ~€37 max loss per stop-out at full confidence

# --- Confidence-weighted sizing (position-sizer) ---
sizing_full_score: 80 # score >= 80 -> full risk budget
sizing_half_score: 60 # 60-79 -> sizing_half_mult x budget
sizing_half_mult: 0.6
sizing_low_mult: 0.35 # below 60, or unscored

# --- Small-account floor ---
min_risk_budget_usd: 15 # refuse trades whose weighted budget is below this — commissions/spread would eat the edge

# --- Trade Classes ---
# Swings scale with the live intraday budget (1.0%): 1.5% keeps a 3-swing
# book's total stop-out cost under ~5% of the account.
swing_risk_pct: 1.5 # ~€55 max loss per swing stop-out on €3.7K — REVIEW before go-live
max_swing_positions: 3
# Earnings bets are PAPER-ONLY until the class has its own track record
# (~10 bets with acceptable outcomes on paper). Flip earnings_bet_enabled
# only after that review — the budget below is pre-set for that day.
earnings_bet_enabled: false
max_earnings_bets: 1
earnings_bet_risk_pct: 1.0 # worst-case gap loss ~€37 on €3.7K, once enabled
earnings_bet_gap_floor_pct: 20

# --- Fractional shares ---
# KEEP FALSE: IBKR hard-blocks fractional EQUITY orders via the TWS API
# (error 10243 "use the desktop version", verified live on paper
# 2026-08-05 — a server-side policy, not a permission or setting). The
# sizer therefore trades whole shares: symbols above the position cap
# per share (~€740 at 20% of €3.7K) are refused as unaffordable. The
# fractional code path stays ready should IBKR ever lift the block.
fractional_shares: false
