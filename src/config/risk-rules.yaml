# Risk Management Rules
# Used by the risk_manager tool to validate trade recommendations.
# All values are configurable — adjust to match your risk tolerance.

# --- Position Sizing ---
max_position_pct: 5 # Max % of account value per position
max_open_positions: 10 # Max number of simultaneous positions
fractional_shares: false # KEEP FALSE: IBKR hard-blocks fractional EQUITY orders via the TWS API (error 10243, verified live 2026-08-05) — the account permission and desktop UI allow fractions, the API does not. Code kept ready for the day IBKR lifts it.

# --- Daily Limits ---
max_daily_loss_pct: 2 # Stop trading after this % drawdown in a day
max_daily_trades: 20 # Max number of round-trip trades per day

# --- Sector Exposure ---
max_sector_exposure_pct: 20 # Max % of account in a single sector

# --- Risk/Reward ---
min_risk_reward: 2.0 # Minimum reward-to-risk ratio for new trades
mandatory_stop_loss: true # Every trade must have a stop loss

# --- Overnight ---
max_overnight_exposure_pct: 30 # Max % of account held overnight
max_overnight_position_pct: 3 # Max % per position held overnight (tighter than intraday)

# --- Price & Liquidity Filters ---
min_price: 5.0 # Avoid penny stocks
min_avg_volume: 500000 # Minimum 20-day average daily volume (shares) — HARD gate at acceptance since WP7
max_spread_pct: 0.5 # Refuse when bid-ask spread > this % of mid — a wide spread is a tax the R/R never priced
max_adv_pct: 1.0 # Refuse orders larger than this % of the 20-day ADV — market-impact bound

# --- ATR-Based Stops ---
stop_atr_multiplier: 1.5 # Default stop = entry ± 1.5 × ATR
min_stop_atr_fraction: 0.4 # Refuse stops closer than this × daily ATR(14) — inside intraday noise
max_extension_atr: 3 # Refuse entries further than this × daily ATR beyond the 10-day EMA (chasing)
# Refuse INTRADAY-class targets further than this × daily ATR from entry — the
# reachability cap. 82-trade audit (2026-08-18): 81% of planned R:R sat pinned at
# ~2:1 with targets a median 6% from entry (manufactured from the ratio, not read
# from structure) and only 10% were ever reached — 33% is breakeven at 2:1. A DAY
# trade cannot expect 2-3 daily ATRs of travel in a fraction of one session.
# Implies intraday stops live in [min_stop_atr_fraction, max_target_atr/min_risk_reward]
# × ATR (0.4-0.75 at defaults). Swing/earnings-bet classes and post-earnings
# repricing days are exempt. 0 disables. Tune from executed-trade MFE once
# a few weeks of excursion data accumulate.
max_target_atr: 1.5

# --- Per-Trade Risk Budget ---
max_risk_per_trade_pct: 0.25 # Max loss if the stop fills (qty × stop distance), as % of net liquidation

# --- Take-at-x% exit policy (WP-EXIT, operator decision 2026-08-22) ---
# "Better now than later": the INTRADAY target IS the take level —
# x = clamp(take_atr_mult × dailyATR%, take_floor_pct, take_cap_pct), with a
# model take_pct override allowed inside [floor, cap]. The 2:1 gate judged
# against this target forces stops <= x/2. When the floor pushes the target
# past the max_target_atr reachability cap, the CAP WINS: the symbol is
# intraday-ineligible (daily ATR too low for the take band — in practice
# dailyATR% >= take_floor_pct / take_atr_mult = 2 at defaults).
take_atr_mult: 1.5 # x as an ATR multiple (matches the reachability evidence)
take_floor_pct: 3 # Lower clamp on x (%)
take_cap_pct: 10 # Upper clamp on x (%) — also caps model take_pct overrides
# 'target' (default): the bracket LMT sits at x% — broker-side, survives a
# gateway outage. 'ratchet': profit-trail arms at +x%, locks x−1% via the
# stop, and hands the exit to the runner trail. FLIPPING THIS ENDS A FROZEN
# VALIDATION SAMPLE (VALIDATION-PROTOCOL.md).
exit_style: target

# --- Profit Trail (automatic winner protection) ---
# ATR-aware geometry (2026-08-11): the trail thresholds scale with the
# symbol's daily ATR so they are uniform in R-space. The old absolute pair
# (5% / 1.5%) never armed below ~1.7% ATR (mega-caps hit the 2:1 target
# first) and flushed 3-5%-ATR runners at ~0.5-0.8R inside one bar's noise —
# after cancelling the 2R target it was supposed to beat.
# Geometry with the standard 1.5x ATR stop: arm at 2.5xATR = 1.67R (the
# trade has paid for itself), trail 0.75xATR, worst exit after arming
# (2.5-0.75)xATR = 1.17R — arming never turns a winner into sub-1R.
profit_trail_arm_atr_mult: 2.5 # Arm once unrealized gain >= this x daily ATR (% of basis)
profit_trail_pullback_atr_mult: 0.75 # Close when price gives back this x daily ATR from the peak
profit_trail_arm_pct: 5 # FALLBACK (ATR unavailable): arm at this absolute %
profit_trail_pullback_pct: 1.5 # FALLBACK (ATR unavailable): close on this % pullback
profit_trail_replaces_target: true # Runner mode: on arming, cancel the fixed target leg — the trail manages the exit (stop stays)

# --- Trade Classes ---
# intraday (default): sized by stop distance against max_risk_per_trade_pct.
# swing: pattern trades (pullback / flat base / cup-and-handle), GTC, held up
#        to ~2 weeks; must plan an exit before any earnings print in window.
# earnings-bet: deliberate hold THROUGH a print. A stop cannot protect through
#        a gap, so sizing assumes the worst historical post-print move.
swing_risk_pct: 0.5 # Per-trade risk budget for swing positions (% of NetLiq)
max_swing_positions: 3 # Max concurrent swing positions (executed + working)
earnings_bet_enabled: true # Paper profile: the class is live for its burn-in
max_earnings_bets: 1 # One open earnings bet at a time — training wheels
earnings_bet_risk_pct: 0.25 # Worst-case gap loss budget (% of NetLiq)
earnings_bet_gap_floor_pct: 20 # Assume at least a 20% adverse gap when sizing
earnings_bet_min_verified: 4 # Evidence bar: at least this many CALENDAR-VERIFIED prints (gap-snap inferred prints cannot carry a record alone)
